<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2196F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
  <title>PyTodo-Qt</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body>
  <div id="offline-banner" class="hidden">Offline — changes will sync when reconnected</div>

  <div id="install-banner" class="hidden">
    <span id="install-text"></span>
    <button id="install-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Header -->
  <header id="header">
    <div class="header-top">
      <h1 id="header-title">PyTodo-Qt</h1>
      <div id="connection-dot" class="dot online" title="Connected"></div>
    </div>
    <div class="header-controls">
      <select id="list-select" aria-label="Select list"></select>
      <div id="view-toggle" class="view-toggle hidden">
        <button class="view-btn active" data-view="list" aria-label="List view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="4" x2="15" y2="4"/><line x1="3" y1="9" x2="15" y2="9"/><line x1="3" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
        <button class="view-btn" data-view="board" aria-label="Board view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="2" width="4" height="14" rx="1"/><rect x="7" y="2" width="4" height="10" rx="1"/><rect x="13" y="2" width="4" height="12" rx="1"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Views container -->
  <main id="main">
    <!-- Home view: list + board modes -->
    <div id="view-home" class="view active">
      <!-- List mode -->
      <div id="list-view" class="view-mode active">
        <div id="sort-bar" class="sort-bar">
          <button id="sort-btn" class="sort-btn" aria-label="Sort items">Sort</button>
          <select id="sort-select" class="sort-select hidden" aria-label="Sort by">
            <option value="default">Default (completion, priority)</option>
            <option value="priority">Priority</option>
            <option value="due_date">Due date</option>
            <option value="alpha">Alphabetical</option>
            <option value="created">Created date</option>
          </select>
        </div>
        <div id="items-container"></div>
        <p id="empty-msg" class="hidden">No items yet — tap + to add your first task</p>
      </div>

      <!-- Board mode -->
      <div id="board-view" class="view-mode">
        <div id="board-container" class="board-container"></div>
        <p id="board-empty-msg" class="hidden">No columns configured</p>
      </div>
    </div>

    <!-- Search view -->
    <div id="view-search" class="view">
      <div class="search-header">
        <input type="text" id="search-input" placeholder="Search items..." autocomplete="off" aria-label="Search">
      </div>
      <div id="search-filters" class="search-filters">
        <div class="filter-group">
          <label>Priority</label>
          <div class="filter-chips">
            <button class="chip" data-filter="priority" data-value="1">High</button>
            <button class="chip" data-filter="priority" data-value="2">Normal</button>
            <button class="chip" data-filter="priority" data-value="3">Low</button>
          </div>
        </div>
        <div class="filter-group">
          <label>Status</label>
          <div class="filter-chips">
            <button class="chip active" data-filter="status" data-value="all">All</button>
            <button class="chip" data-filter="status" data-value="active">Active</button>
            <button class="chip" data-filter="status" data-value="completed">Completed</button>
          </div>
        </div>
        <div class="filter-group">
          <label>Due</label>
          <div class="filter-chips">
            <button class="chip" data-filter="due" data-value="overdue">Overdue</button>
            <button class="chip" data-filter="due" data-value="today">Today</button>
            <button class="chip" data-filter="due" data-value="week">This week</button>
            <button class="chip" data-filter="due" data-value="none">No date</button>
          </div>
        </div>
        <div id="search-tag-filters" class="filter-group hidden">
          <label>Tags</label>
          <div id="search-tag-chips" class="filter-chips"></div>
        </div>
      </div>
      <div id="search-results"></div>
      <p id="search-empty" class="hidden">No results found</p>
    </div>

    <!-- Settings view -->
    <div id="view-settings" class="view">
      <div class="settings-section">
        <h2>Status</h2>
        <div id="settings-status" class="settings-info"></div>
      </div>
      <div class="settings-section">
        <h2>About</h2>
        <p class="text-secondary">PyTodo-Qt — Privacy-first todo manager</p>
        <p class="text-secondary" id="version-text"></p>
      </div>
    </div>
  </main>

  <!-- Smart add sheet -->
  <div id="add-sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <h2>Add Task</h2>
        <button id="add-sheet-close" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <form id="add-form">
        <textarea id="add-input" placeholder="What needs to be done?" rows="2" autocomplete="off"></textarea>
        <div id="add-entities" class="entity-chips"></div>
        <div class="add-meta-row">
          <select id="add-list-select" aria-label="Target list"></select>
        </div>
        <button type="submit" id="add-submit" class="btn-primary">Add</button>
      </form>
    </div>
  </div>

  <!-- Item detail sheet -->
  <div id="detail-sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <h2>Item Details</h2>
        <button id="detail-close" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Bottom navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="home" aria-label="Home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001 1h4a1 1 0 001-1v-5a1 1 0 011-1h2"/>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-btn add-btn" id="nav-add" aria-label="Add task">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <button class="nav-btn" data-view="search" aria-label="Search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <span>Search</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    }
  </script>
</body>
</html>
