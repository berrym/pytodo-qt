name: Publish to PyPI

on:
  release:
    types: [published]

# PyPI is reserved for finals only — prerelease tags (alpha, beta, rc,
# dev) trigger this workflow but skip both jobs so nothing reaches
# pypi.org until the official x.y.z release goes out. Without this
# guard, every prerelease tag would attempt a PyPI upload, which is
# exactly the noise we want to avoid in the v0.3.11 test cycle.
jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
