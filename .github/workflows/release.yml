name: Build Release Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.3.11.dev10)'
        required: true
        default: '0.3.11.dev10'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact_name: pytodo-qt-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: pytodo-qt-linux-arm64
          - os: macos-15-intel
            arch: x86_64
            artifact_name: pytodo-qt-macos-x86_64
          - os: macos-latest
            arch: arm64
            artifact_name: pytodo-qt-macos-arm64
          - os: windows-latest
            arch: x86_64
            artifact_name: pytodo-qt-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      # PNG icons are pre-rendered and committed to the repo (no cairosvg needed at build time)
      # Linux uses the PNG directly, Windows/macOS convert to platform-specific formats

      - name: Convert PNG to ICO (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          magick convert src/pytodo_qt/gui/icons/pytodo-qt-256.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            src/pytodo_qt/gui/icons/pytodo-qt.ico

      - name: Convert PNG to ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          # Create iconset directory
          mkdir -p pytodo-qt.iconset

          # Generate all required icon sizes from committed 1024px PNG
          sips -z 16 16 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_16x16.png
          sips -z 32 32 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_16x16@2x.png
          sips -z 32 32 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_32x32.png
          sips -z 64 64 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_32x32@2x.png
          sips -z 128 128 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_128x128.png
          sips -z 256 256 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_128x128@2x.png
          sips -z 256 256 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_256x256.png
          sips -z 512 512 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_256x256@2x.png
          sips -z 512 512 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_512x512.png
          sips -z 1024 1024 src/pytodo_qt/gui/icons/pytodo-qt-1024.png --out pytodo-qt.iconset/icon_512x512@2x.png

          # Create icns file
          iconutil -c icns pytodo-qt.iconset -o src/pytodo_qt/gui/icons/pytodo-qt.icns

          # Create 256x256 PNG for consistency
          sips -z 256 256 pytodo-qt.svg.png --out src/pytodo_qt/gui/icons/pytodo-qt-256.png

      - name: Build executable (non-macOS)
        if: runner.os != 'macOS'
        run: pyinstaller packaging/pyinstaller/pytodo-qt.spec

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm packaging/pyinstaller/pytodo-qt.spec

      - name: Delete crashing Qt permission plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          # These plugins cause _CFGetNonObjCTypeID crash in Qt 6.5+ on macOS
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_location.dylib" -delete
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_camera.dylib" -delete
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_microphone.dylib" -delete
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_bluetooth.dylib" -delete
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_contacts.dylib" -delete
          find dist/pytodo-qt.app -name "libqdarwinpermissionplugin_calendar.dylib" -delete
          echo "Deleted Qt permission plugins that crash on macOS"

      - name: Ad-hoc sign application (macOS)
        if: runner.os == 'macOS'
        run: |
          # 1. Remove extended attributes that can cause signing issues
          xattr -rc dist/pytodo-qt.app

          # 2. Remove existing signatures (PyInstaller signs by default)
          find dist/pytodo-qt.app -name "_CodeSignature" -exec rm -rf {} +

          # 3. Apply fresh ad-hoc signature with hardened runtime
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements packaging/macos/entitlements.plist \
            dist/pytodo-qt.app

          # 4. Verify signature
          codesign --verify --verbose --deep dist/pytodo-qt.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          PACKAGE_NAME="pytodo-qt-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "${PACKAGE_NAME}"
          # Copy the entire onedir output
          cp -r dist/pytodo-qt/* "${PACKAGE_NAME}/"
          cp packaging/linux/pytodo-qt.desktop "${PACKAGE_NAME}/"
          cp packaging/linux/install.sh "${PACKAGE_NAME}/"
          cp packaging/linux/uninstall.sh "${PACKAGE_NAME}/"
          cp src/pytodo_qt/gui/icons/pytodo-qt-256.png "${PACKAGE_NAME}/pytodo-qt.png"
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          echo "ASSET_PATH=${PACKAGE_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_NAME=${PACKAGE_NAME}.tar.gz" >> $GITHUB_ENV

      # AppImage ships alongside the tar.gz as a self-contained
      # executable. We pull the matching-arch appimagetool from its
      # `continuous` release and run with --appimage-extract-and-run
      # so the build doesn't need FUSE on the GHA runner (Ubuntu
      # 22.04+ dropped libfuse2 from the default image). The AppDir
      # layout keeps the PyInstaller onedir output untouched at
      # AppDir/pytodo-qt/ and uses a thin AppRun shell wrapper that
      # execs the existing binary — so relative-path lookups inside
      # the bundle (Path(__file__).parent.parent / "fonts" etc.)
      # resolve exactly the same way they do from the tar.gz.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          APPIMAGE_NAME="pytodo-qt-${VERSION}-linux-${{ matrix.arch }}.AppImage"

          # Map matrix arch to AppImage naming convention
          case "${{ matrix.arch }}" in
            x86_64) APPIMAGE_ARCH=x86_64 ;;
            arm64)  APPIMAGE_ARCH=aarch64 ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          curl -fSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x appimagetool

          # Stage the AppDir
          mkdir -p AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          # PyInstaller onedir output, untouched
          cp -r dist/pytodo-qt AppDir/pytodo-qt

          # Desktop entry — both at AppDir root (appimagetool hard
          # requirement) and at the FHS path so desktop integration
          # works once the AppImage is installed by user tooling.
          cp packaging/linux/pytodo-qt.desktop AppDir/pytodo-qt.desktop
          cp packaging/linux/pytodo-qt.desktop AppDir/usr/share/applications/pytodo-qt.desktop

          # Icon — root copy (appimagetool requirement) + FHS hicolor
          # path + .DirIcon symlink (AppImage convention).
          cp src/pytodo_qt/gui/icons/pytodo-qt-256.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/pytodo-qt.png
          cp src/pytodo_qt/gui/icons/pytodo-qt-256.png AppDir/pytodo-qt.png
          ln -s pytodo-qt.png AppDir/.DirIcon

          # AppRun — tiny exec wrapper, must be executable
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/pytodo-qt/pytodo-qt" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          ARCH="${APPIMAGE_ARCH}" ./appimagetool --appimage-extract-and-run \
            AppDir "${APPIMAGE_NAME}"

          echo "APPIMAGE_PATH=${APPIMAGE_NAME}" >> $GITHUB_ENV
          echo "APPIMAGE_NAME=${APPIMAGE_NAME}" >> $GITHUB_ENV

      # create-dmg wraps the already-signed .app in a DMG with a custom
      # background, a drag-to-Applications alias, and first-launch
      # instructions baked into the background image. We deliberately
      # DO NOT pass --sandbox-safe: in the version shipped by the
      # macOS runners, that flag skips blessing and in practice
      # produces a DMG with no applied layout (no background, default
      # icon positions, default window size). Cryptomator ships the
      # same create-dmg path daily on macos-15 without it. The
      # job-level timeout-minutes makes a hung osascript fail fast
      # instead of burning the full runner budget if Finder ever
      # gets wedged.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          python -m pip install pillow

      - name: Generate DMG background (macOS)
        if: runner.os == 'macOS'
        run: python packaging/macos/make_dmg_background.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          PACKAGE_NAME="pytodo-qt-${VERSION}-macos-${{ matrix.arch }}"
          # Stage the .app in its own folder so create-dmg lays out a
          # clean DMG with just the app bundle plus the Applications alias.
          mkdir -p dmg-staging
          cp -R dist/pytodo-qt.app dmg-staging/
          create-dmg \
            --volname "PyTodo-Qt ${VERSION}" \
            --background packaging/macos/dmg_background.png \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "pytodo-qt.app" 150 180 \
            --app-drop-link 450 180 \
            --hide-extension "pytodo-qt.app" \
            --hdiutil-retries 10 \
            "${PACKAGE_NAME}.dmg" \
            dmg-staging
          echo "ASSET_PATH=${PACKAGE_NAME}.dmg" >> $GITHUB_ENV
          echo "ASSET_NAME=${PACKAGE_NAME}.dmg" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          $packageName = "pytodo-qt-${version}-windows-${{ matrix.arch }}"
          # Copy (don't rename) the onedir output so the Inno Setup
          # build below can still reference it at dist\pytodo-qt\.
          Copy-Item -Recurse -Path "dist\pytodo-qt" -Destination "dist\${packageName}"
          Compress-Archive -Path "dist\${packageName}" -DestinationPath "${packageName}.zip"
          echo "ASSET_PATH=${packageName}.zip" >> $env:GITHUB_ENV
          echo "ASSET_NAME=${packageName}.zip" >> $env:GITHUB_ENV

      # Inno Setup ships the .exe installer alongside the zip. We
      # install it via Chocolatey on the windows-latest runner (the
      # innosetup package is officially maintained), thread the
      # version into the .iss via /DAppVersion, and let ISCC write
      # the installer to the repo root where the upload steps can
      # find it with a predictable name.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          iscc /DAppVersion=$version packaging\windows\pytodo-qt.iss
          $installerName = "pytodo-qt-${version}-windows-x86_64-setup.exe"
          if (-not (Test-Path $installerName)) {
            throw "Installer not produced at expected path: $installerName"
          }
          echo "INSTALLER_PATH=${installerName}" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=${installerName}" >> $env:GITHUB_ENV

      # SHA256 checksum sits next to each artifact as a sibling
      # `<artifact>.sha256` file in the standard sha256sum -c format
      # (`<hex>  <basename>`). Users verify a single download with
      # `sha256sum -c file.tar.gz.sha256`. The format is identical
      # across all three platforms even though each host produces
      # it with its own native tool.
      - name: Generate checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          sha256sum "$ASSET_PATH" > "${ASSET_PATH}.sha256"
          cat "${ASSET_PATH}.sha256"
          if [ -n "${APPIMAGE_PATH:-}" ]; then
            sha256sum "$APPIMAGE_PATH" > "${APPIMAGE_PATH}.sha256"
            cat "${APPIMAGE_PATH}.sha256"
          fi

      - name: Generate checksum (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "$(dirname "$ASSET_PATH")"
          shasum -a 256 "$(basename "$ASSET_PATH")" > "$(basename "$ASSET_PATH").sha256"
          cat "$(basename "$ASSET_PATH").sha256"

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Write-Sha256([string]$path) {
            $basename = Split-Path -Leaf $path
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
            $line = "$hash  $basename"
            $sha256Path = "$path.sha256"
            # ASCII (no BOM) so the file is byte-identical to sha256sum output
            [System.IO.File]::WriteAllText($sha256Path, "$line`n", [System.Text.UTF8Encoding]::new($false))
            Get-Content $sha256Path
          }
          Write-Sha256 $env:ASSET_PATH
          if ($env:INSTALLER_PATH) {
            Write-Sha256 $env:INSTALLER_PATH
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256

      - name: Upload AppImage artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: |
            ${{ env.APPIMAGE_PATH }}
            ${{ env.APPIMAGE_PATH }}.sha256

      - name: Upload installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.INSTALLER_NAME }}
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_PATH }}.sha256

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage release asset (Linux)
        if: github.event_name == 'release' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APPIMAGE_PATH }}
            ${{ env.APPIMAGE_PATH }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer release asset (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_PATH }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
