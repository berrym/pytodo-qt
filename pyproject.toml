[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytodo_qt = ["*.png", "*.qss"]
"pytodo_qt.gui.icons" = ["*.png", "*.svg", "*.ico", "*.icns"]
"pytodo_qt.gui.sounds" = ["*.wav"]
"pytodo_qt.gui.fonts" = ["*.ttf", "*.txt"]
"pytodo_qt.gui.styles" = ["*.qss"]
"pytodo_qt.web.static" = ["*.html", "*.css", "*.js", "*.json", "*.png"]
"pytodo_qt.core.intents" = ["*.yaml"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # allow if-else instead of ternary
]

[tool.ruff.lint.isort]
known-first-party = ["pytodo_qt"]

[project]
name = "pytodo-qt"
version = "0.3.11.dev10"
description = "A cross-platform to-do list manager with encrypted peer-to-peer synchronization"
readme = "README.md"
authors = [
    {name = "Michael Berry", email = "trismegustis@gmail.com"},
]
dependencies = [
    "PyQt6>=6.4",
    "cryptography>=41.0",
    "zeroconf>=0.80",
    "keyring>=24.0",
    "qasync>=0.24",
    "rich>=13.0",
    "icalendar>=6.0",
    "aiohttp>=3.9",
    "qrcode>=7.0",
    "pyqtgraph>=0.13",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "dateparser>=1.2",
    "rapidfuzz>=3.0",
    "ruamel-yaml>=0.19.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
license = {text = "GPLv3"}
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "basedpyright>=1.18",
]

[project.urls]
Homepage = "https://github.com/berrym/pytodo-qt"

[project.scripts]
pytodo-qt = "pytodo_qt.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "basedpyright>=1.18",
]

[tool.coverage.run]
source = ["src/pytodo_qt"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
# Realistic threshold based on current state. Aspirational target is 70%,
# which requires significant test additions for the large GUI dialogs
# (settings, device_manager, peer_manager, main_window) and is tracked
# in the project plan.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
